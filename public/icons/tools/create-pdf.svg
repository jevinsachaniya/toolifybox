<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="cpdf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="cpdf-badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#047857" flood-opacity="0.35" />
    </filter>
    <linearGradient id="cpdf-page" x1="16" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="cpdf-fold" x1="38" y1="6" x2="50" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <linearGradient id="cpdf-badge" x1="36" y1="34" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cpdf-pen" x1="8" y1="36" x2="28" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Main Sheet Body with dog-ear cutout -->
  <g filter="url(#cpdf-shadow)">
    <path d="M16 8 C16 6.9 16.9 6 18 6 L38 6 L50 18 L50 54 C50 55.1 49.1 56 48 56 L18 56 C16.9 56 16 55.1 16 54 Z" fill="url(#cpdf-page)" stroke="#86efac" stroke-width="0.8" />
    <!-- Folded dog-ear corner -->
    <path d="M38 6 L38 16 C38 17.1 38.9 18 40 18 L50 18 Z" fill="url(#cpdf-fold)" stroke="#4ade80" stroke-width="0.5" />
  </g>

  <!-- Document Template Lines -->
  <rect x="22" y="24" width="22" height="2" rx="1" fill="#10b981" opacity="0.6" />
  <rect x="22" y="30" width="18" height="2" rx="1" fill="#94a3b8" opacity="0.5" />
  <rect x="22" y="36" width="14" height="2" rx="1" fill="#94a3b8" opacity="0.5" />
  <rect x="22" y="42" width="16" height="2" rx="1" fill="#94a3b8" opacity="0.5" />

  <!-- Create Plus Badge -->
  <g filter="url(#cpdf-badge-shadow)">
    <circle cx="46" cy="44" r="10" fill="url(#cpdf-badge)" stroke="#ffffff" stroke-width="1.5" />
    <path d="M46 39 L46 49 M41 44 L51 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Magic Sparkle Top Left -->
  <path d="M11 14 Q13 14 13 12 Q13 14 15 14 Q13 14 13 16 Q13 14 11 14 Z" fill="#10b981" />
  <circle cx="10" cy="22" r="1" fill="#059669" />
</svg>

