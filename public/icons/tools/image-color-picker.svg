<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="icp-card-bg" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="icp-swatch-1" x1="12" y1="12" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="icp-swatch-2" x1="26" y1="12" x2="36" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="icp-swatch-3" x1="12" y1="26" x2="22" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="icp-swatch-4" x1="26" y1="26" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="icp-dropper" x1="18" y1="10" x2="38" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="icp-shadow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Base Card with Shadow -->
  <g filter="url(#icp-shadow)">
    <rect x="7" y="7" width="34" height="34" rx="8" fill="url(#icp-card-bg)"/>
    <rect x="7" y="7" width="34" height="34" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- 4 Color Swatches (Palette Grid) -->
  <circle cx="15.5" cy="15.5" r="4.5" fill="url(#icp-swatch-1)"/>
  <circle cx="28.5" cy="15.5" r="4.5" fill="url(#icp-swatch-2)"/>
  <circle cx="15.5" cy="28.5" r="4.5" fill="url(#icp-swatch-3)"/>
  <circle cx="28.5" cy="28.5" r="4.5" fill="url(#icp-swatch-4)"/>

  <!-- Color Palette Border Rings -->
  <circle cx="15.5" cy="15.5" r="5.2" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="28.5" cy="15.5" r="5.2" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="15.5" cy="28.5" r="5.2" stroke="#ffffff" stroke-width="1.4"/>
  <circle cx="28.5" cy="28.5" r="5.2" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Eyedropper Pipette Tool Overlaid diagonally -->
  <g transform="translate(18, 8) rotate(15)">
    <!-- Pipette Bulb -->
    <path d="M12 2 C13.5 0.5 15.5 0.5 17 2 C18.5 3.5 18.5 5.5 17 7 L15.5 8.5 L10.5 3.5 L12 2 Z" fill="#334155"/>
    <path d="M10 4 L15 9 L13.5 10.5 L8.5 5.5 L10 4 Z" fill="#64748b"/>
    <!-- Glass Barrel -->
    <path d="M8.5 5.5 L13.5 10.5 L8 16 C7 17 5 18 3 19 C4 17 5 15 6 14 L8.5 5.5 Z" fill="url(#icp-dropper)"/>
    <!-- Liquid / Sample Indicator -->
    <path d="M5.5 14.5 L7.5 16.5 L4.5 18 C4 17 4.5 15.5 5.5 14.5 Z" fill="#f43f5e"/>
    <!-- Eyedropper Tip Point -->
    <circle cx="2.5" cy="19.5" r="1.5" fill="#f43f5e"/>
  </g>

  <!-- Glowing Sample Target Ring at Tip -->
  <circle cx="20" cy="30" r="3" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <circle cx="20" cy="30" r="1" fill="#f43f5e"/>

  <!-- Sparkle Accent -->
  <path d="M37 9 L38 12 L41 13 L38 14 L37 17 L36 14 L33 13 L36 12 Z" fill="#38bdf8"/>
</svg>

