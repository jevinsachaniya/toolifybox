<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="col-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <filter id="col-glow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>

    <!-- Canvas Frame Background -->
    <linearGradient id="col-frame" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Left Hero Photo Tile Gradient (Sunset / Sky) -->
    <linearGradient id="col-tile-left" x1="12" y1="12" x2="30" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Top-Right Photo Tile Gradient (Cyan Ocean) -->
    <linearGradient id="col-tile-top" x1="34" y1="12" x2="52" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bottom-Right Photo Tile Gradient (Warm Amber / Sun) -->
    <linearGradient id="col-tile-bot" x1="34" y1="34" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Floating Badge Gradient -->
    <linearGradient id="col-badge" x1="40" y1="40" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Outer Collage Canvas with Drop Shadow -->
  <g filter="url(#col-shadow)">
    <!-- Base Outer Frame -->
    <rect x="8" y="8" width="48" height="48" rx="8" fill="url(#col-frame)" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Left Large Hero Photo Tile (Left Half) -->
    <rect x="12" y="12" width="20" height="40" rx="4.5" fill="url(#col-tile-left)" />
    <!-- Sun/Moon Graphic in Hero Tile -->
    <circle cx="22" cy="22" r="4" fill="#ffffff" fill-opacity="0.85" />
    <!-- Mountains in Hero Tile -->
    <path d="M12 44 L19 32 L25 41 L28 37 L32 44 Z" fill="#ffffff" fill-opacity="0.35" />

    <!-- Top-Right Photo Tile (Top / Right) -->
    <rect x="34" y="12" width="18" height="19" rx="4.5" fill="url(#col-tile-top)" />
    <!-- Ocean Waves in Top Tile -->
    <circle cx="43" cy="18" r="2.5" fill="#ffffff" fill-opacity="0.8" />
    <path d="M34 26 C37 24 41 27 45 25 C48 24 50 25 52 26 L52 31 L34 31 Z" fill="#ffffff" fill-opacity="0.3" />

    <!-- Bottom-Right Photo Tile (Bottom / Right) -->
    <rect x="34" y="33" width="18" height="19" rx="4.5" fill="url(#col-tile-bot)" />
    <!-- Geometric Burst in Bottom Tile -->
    <circle cx="43" cy="42" r="3" fill="#ffffff" fill-opacity="0.8" />
    <path d="M34 46 L40 40 L45 44 L49 39 L52 43 L52 52 L34 52 Z" fill="#ffffff" fill-opacity="0.3" />
  </g>

  <!-- Floating Collage Badge (bottom-right overlap) -->
  <g filter="url(#col-glow)">
    <circle cx="49" cy="49" r="8.5" fill="url(#col-badge)" stroke="#ffffff" stroke-width="1.5" />
    <!-- 4-tile grid mini glyph in badge -->
    <rect x="44.5" y="44.5" width="3.5" height="3.5" rx="0.8" fill="#ffffff" />
    <rect x="49.5" y="44.5" width="3.5" height="3.5" rx="0.8" fill="#ffffff" />
    <rect x="44.5" y="49.5" width="3.5" height="3.5" rx="0.8" fill="#ffffff" />
    <rect x="49.5" y="49.5" width="3.5" height="3.5" rx="0.8" fill="#ffffff" />
  </g>
</svg>

