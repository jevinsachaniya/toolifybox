<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="h2p-html-grad" x1="6" y1="10" x2="26" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="h2p-pdf-grad" x1="20" y1="12" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="h2p-arrow-grad" x1="16" y1="20" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="h2p-shadow" x="2" y="2" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Left Sheet: HTML Code Document -->
  <g filter="url(#h2p-shadow)">
    <rect x="6" y="8" width="19" height="27" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M19 8 L25 14 H21 A2 2 0 0 1 19 12 V8 Z" fill="#cbd5e1"/>
    <!-- HTML badge -->
    <rect x="8.5" y="16" width="14" height="6.5" rx="1.5" fill="url(#h2p-html-grad)"/>
    <text x="15.5" y="20.8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="3.6" font-weight="900" text-anchor="middle" letter-spacing="0.2">&lt;/&gt;</text>
    <!-- Code lines -->
    <rect x="9.5" y="25" width="12" height="1.8" rx="0.9" fill="#94a3b8"/>
    <rect x="9.5" y="28.5" width="8" height="1.8" rx="0.9" fill="#cbd5e1"/>
  </g>

  <!-- Right Sheet: PDF Output Document -->
  <g filter="url(#h2p-shadow)">
    <rect x="23" y="13" width="19" height="27" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
    <path d="M36 13 L42 19 H38 A2 2 0 0 1 36 17 V13 Z" fill="#fca5a5"/>
    <!-- Red PDF badge -->
    <rect x="25.5" y="21" width="14" height="6.5" rx="1.5" fill="url(#h2p-pdf-grad)"/>
    <text x="32.5" y="25.8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="3.6" font-weight="900" text-anchor="middle" letter-spacing="0.2">PDF</text>
    <!-- Document lines -->
    <rect x="26.5" y="30" width="12" height="1.8" rx="0.9" fill="#f87171"/>
    <rect x="26.5" y="33.5" width="8" height="1.8" rx="0.9" fill="#fca5a5"/>
  </g>

  <!-- Circular Transfer Action Badge in center -->
  <g filter="url(#h2p-shadow)">
    <circle cx="24" cy="24" r="7.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="url(#h2p-arrow-grad)"/>
    <!-- Right arrow icon -->
    <path d="M22 21 L26 24 L22 27" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

