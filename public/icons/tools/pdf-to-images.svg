<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="p2i-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="p2i-pdf" x1="4" y1="12" x2="28" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="p2i-photo1" x1="28" y1="14" x2="52" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="p2i-photo2" x1="34" y1="22" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left PDF Sheet -->
  <g filter="url(#p2i-shadow)">
    <rect x="5" y="14" width="24" height="30" rx="4" fill="url(#p2i-pdf)" stroke="#fda4af" stroke-width="0.75" />
    <text x="17" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
    <rect x="9" y="32" width="16" height="2" rx="1" fill="#ffffff" opacity="0.7" />
    <rect x="9" y="36" width="11" height="2" rx="1" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Fanned Photo 1 (Back Blue) -->
  <g filter="url(#p2i-shadow)" transform="rotate(8 42 28)">
    <rect x="30" y="14" width="24" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <rect x="32" y="16" width="20" height="17" rx="2.5" fill="url(#p2i-photo1)" />
    <circle cx="48" cy="21" r="2.5" fill="#fef08a" />
    <path d="M32 33 L39 25 L47 33 Z" fill="#0369a1" />
  </g>

  <!-- Fanned Photo 2 (Front Amber) -->
  <g filter="url(#p2i-shadow)" transform="rotate(-4 44 38)">
    <rect x="32" y="24" width="26" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <rect x="34" y="26" width="22" height="19" rx="2.5" fill="url(#p2i-photo2)" />
    <circle cx="51" cy="31" r="2.5" fill="#fef3c7" />
    <path d="M34 45 L42 35 L51 45 Z" fill="#b45309" />
    <rect x="34" y="26" width="22" height="9" rx="2.5" fill="#ffffff" fill-opacity="0.25" />
  </g>
</svg>

