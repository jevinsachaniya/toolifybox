<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="trans-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <filter id="trans-glow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>

    <!-- Document Sheet Gradient -->
    <linearGradient id="trans-doc" x1="12" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Left Speech Bubble / Language Chip -->
    <linearGradient id="trans-chip-left" x1="15" y1="20" x2="33" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Speech Bubble / Language Chip -->
    <linearGradient id="trans-chip-right" x1="28" y1="30" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Floating Badge Gradient -->
    <linearGradient id="trans-badge" x1="40" y1="40" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Document Base -->
  <g filter="url(#trans-shadow)">
    <!-- Document Page -->
    <path d="M14 10 C14 8 16 6 18 6 L38 6 L50 18 L50 54 C50 56 48 58 46 58 L18 58 C16 58 14 56 14 54 Z" fill="url(#trans-doc)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Folded Corner -->
    <path d="M38 6 L38 18 L50 18 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Left Bubble: English "A" -->
    <rect x="17" y="21" width="16" height="15" rx="3.5" fill="url(#trans-chip-left)" />
    <!-- Letter A glyph -->
    <path d="M25 24.5 L22 32 L23.8 32 L24.4 30.5 L27.6 30.5 L28.2 32 L30 32 L27 24.5 Z M25.8 26.5 L27 29.2 L25 29.2 Z" fill="#ffffff" />

    <!-- Right Bubble: Indic / Asian / Multilingual "文" / "अ" glyph -->
    <rect x="29" y="31" width="16" height="15" rx="3.5" fill="url(#trans-chip-right)" />
    <!-- Stylized language glyph -->
    <path d="M37 34 L37 36 M33 36 L41 36 M34.5 37.5 L39.5 42 M39 37.5 C38 39.5 36.5 41 34 42.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Transfer curved arrows connecting bubbles -->
    <path d="M26 38 C28 41 32 40 33 38" stroke="#6366f1" stroke-width="1.3" stroke-linecap="round" />
    <path d="M36 29 C34 26 30 27 29 29" stroke="#0284c7" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Floating Translation Badge -->
  <g filter="url(#trans-glow)">
    <circle cx="49" cy="49" r="8.5" fill="url(#trans-badge)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Globe wireframe -->
    <circle cx="49" cy="49" r="5" stroke="#ffffff" stroke-width="1.2" fill="none" />
    <ellipse cx="49" cy="49" rx="2.5" ry="5" stroke="#ffffff" stroke-width="1.1" fill="none" />
    <line x1="44" y1="49" x2="54" y2="49" stroke="#ffffff" stroke-width="1.1" />
  </g>
</svg>

