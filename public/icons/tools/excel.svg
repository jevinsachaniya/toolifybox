<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="x-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="x-tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#052e16" flood-opacity="0.45" />
    </filter>
    <linearGradient id="x-page" x1="16" y1="4" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="x-fold" x1="40" y1="4" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="x-tile" x1="6" y1="20" x2="38" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="45%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#094a25" />
    </linearGradient>
    <linearGradient id="x-tile-gloss" x1="6" y1="20" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Back Sheet (Spreadsheet Grid) -->
  <g filter="url(#x-shadow)">
    <!-- Main page body with dog-ear cutout -->
    <path d="M18 6 C16.9 6 16 6.9 16 8 L16 54 C16 55.1 16.9 56 18 56 L50 56 C51.1 56 52 55.1 52 54 L52 18 L40 6 L18 6 Z" fill="url(#x-page)" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Folded dog-ear corner -->
    <path d="M40 6 L40 16 C40 17.1 40.9 18 42 18 L52 18 Z" fill="url(#x-fold)" stroke="#6ee7b7" stroke-width="0.5" />
  </g>

  <!-- Spreadsheet Grid & Cells -->
  <g opacity="0.85">
    <!-- Top green banner -->
    <rect x="22" y="14" width="26" height="5" rx="1.5" fill="#107c41" opacity="0.3" />
    <!-- Grid rows & columns -->
    <rect x="34" y="24" width="14" height="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.75" />
    <rect x="34" y="30" width="14" height="6" fill="#ffffff" stroke="#86efac" stroke-width="0.75" />
    <rect x="34" y="36" width="14" height="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.75" />
    <rect x="22" y="42" width="12" height="6" fill="#ffffff" stroke="#86efac" stroke-width="0.75" />
    <rect x="34" y="42" width="14" height="6" fill="#dcfce7" stroke="#86efac" stroke-width="0.75" />
    <rect x="22" y="48" width="12" height="5" fill="#dcfce7" stroke="#86efac" stroke-width="0.75" />
    <rect x="34" y="48" width="14" height="5" fill="#ffffff" stroke="#86efac" stroke-width="0.75" />
  </g>

  <!-- Front 3D Tile (Excel 'X') -->
  <g filter="url(#x-tile-shadow)">
    <rect x="8" y="22" width="30" height="30" rx="6" fill="url(#x-tile)" />
    <!-- Top-edge specular highlight -->
    <rect x="8.5" y="22.5" width="29" height="14" rx="5.5" fill="url(#x-tile-gloss)" />
    <rect x="8" y="22" width="30" height="30" rx="6" stroke="#4ade80" stroke-width="0.75" stroke-opacity="0.5" />
    
    <!-- Bold Embossed Letter 'X' -->
    <path d="M15.5 29 L19.8 37 L15.2 45 L18.6 45 L21.6 39.5 L24.5 45 L28 45 L23.4 37 L27.7 29 L24.3 29 L21.6 34.3 L18.8 29 Z" fill="#ffffff" />
  </g>
</svg>

