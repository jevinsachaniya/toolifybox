<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="mexcel-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
    <linearGradient id="mexcel-back" x1="10" y1="8" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mexcel-front" x1="22" y1="16" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Back Excel Spreadsheet -->
  <g filter="url(#mexcel-shadow)" transform="rotate(-6 24 24)">
    <rect x="10" y="8" width="28" height="36" rx="5" fill="url(#mexcel-back)" stroke="#a7f3d0" stroke-width="0.8" />
    <!-- Table Grid Lines -->
    <rect x="14" y="16" width="20" height="20" rx="2" fill="#ffffff" fill-opacity="0.2" />
    <line x1="14" y1="22" x2="34" y2="22" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="14" y1="28" x2="34" y2="28" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="24" y1="16" x2="24" y2="36" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />
  </g>

  <!-- Front Merged Excel Spreadsheet -->
  <g filter="url(#mexcel-shadow)">
    <rect x="22" y="16" width="30" height="38" rx="5" fill="url(#mexcel-front)" stroke="#6ee7b7" stroke-width="0.8" />
    
    <!-- Top Header Banner -->
    <rect x="22.5" y="16.5" width="29" height="12" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <text x="37" y="25.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">XLSX</text>

    <!-- Spreadsheet Data Grid -->
    <rect x="26" y="32" width="22" height="16" rx="2" fill="#ffffff" fill-opacity="0.15" />
    <line x1="26" y1="37" x2="48" y2="37" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="26" y1="42" x2="48" y2="42" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="33" y1="32" x2="33" y2="48" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="41" y1="32" x2="41" y2="48" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />

    <!-- Combine / Merge Plus Badge -->
    <circle cx="48" cy="46" r="7.5" fill="#ffffff" filter="url(#mexcel-shadow)" />
    <path d="M48 42 L48 50 M44 46 L52 46" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
