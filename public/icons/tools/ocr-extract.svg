<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="ocr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="ocr-doc" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="ocr-accent" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ocr-beam" x1="14" y1="28" x2="50" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="ocr-badge-grad" x1="32" y1="38" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Document Base Sheet -->
  <g filter="url(#ocr-shadow)">
    <rect x="12" y="8" width="40" height="48" rx="6" fill="url(#ocr-doc)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Top highlight -->
    <rect x="13" y="9" width="38" height="14" rx="5" fill="#ffffff" fill-opacity="0.6" />

    <!-- Text line silhouettes -->
    <rect x="18" y="16" width="18" height="2.5" rx="1.25" fill="#0284c7" />
    <rect x="18" y="22" width="28" height="2" rx="1" fill="#64748b" opacity="0.6" />
    <rect x="18" y="27" width="24" height="2" rx="1" fill="#64748b" opacity="0.6" />
    <rect x="18" y="32" width="20" height="2" rx="1" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Scanner Target Reticle / Brackets -->
  <path d="M16 20 L16 15 L21 15" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 20 L48 15 L43 15" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M16 38 L16 43 L21 43" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 38 L48 43 L43 43" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Laser Scan Line -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="url(#ocr-beam)" stroke-width="2.5" stroke-linecap="round" />

  <!-- OCR Badge in bottom right -->
  <g filter="url(#ocr-shadow)">
    <rect x="30" y="38" width="26" height="18" rx="4" fill="url(#ocr-badge-grad)" stroke="#38bdf8" stroke-width="0.75" />
    <text x="43" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">OCR</text>
  </g>
</svg>

