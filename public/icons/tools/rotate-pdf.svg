<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="rot-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="rot-page" x1="18" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
    <linearGradient id="rot-arrow" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Document Sheet -->
  <g filter="url(#rot-shadow)" transform="rotate(10 32 32)">
    <rect x="18" y="14" width="28" height="36" rx="4" fill="url(#rot-page)" stroke="#fed7aa" stroke-width="1.2" />
    <rect x="23" y="22" width="18" height="2.5" rx="1.25" fill="#fdba74" />
    <rect x="23" y="28" width="14" height="2.5" rx="1.25" fill="#fed7aa" />
    <rect x="23" y="34" width="18" height="2.5" rx="1.25" fill="#fed7aa" />
  </g>

  <!-- Circular 3D Rotating Arrow -->
  <g filter="url(#rot-shadow)">
    <path d="M48 20 A22 22 0 1 1 16 32" stroke="url(#rot-arrow)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="M42 16 L50 20 L44 26 Z" fill="#ea580c" />
  </g>
</svg>

