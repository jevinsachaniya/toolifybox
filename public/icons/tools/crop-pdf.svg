<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="crop-bg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crop-sheet" x1="10" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="crop-shadow" x="7" y="5" width="34" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Document Sheet -->
  <g filter="url(#crop-shadow)">
    <rect x="10" y="6" width="28" height="36" rx="4" fill="url(#crop-sheet)"/>
    <path d="M30 6 L38 14 L30 14 Z" fill="#cbd5e1"/>
    <path d="M30 6 L38 14 H32 A2 2 0 0 1 30 12 V6 Z" fill="#94a3b8"/>
  </g>

  <!-- Ghosted Document Lines -->
  <rect x="15" y="16" width="18" height="2" rx="1" fill="#e2e8f0"/>
  <rect x="15" y="21" width="18" height="2" rx="1" fill="#e2e8f0"/>
  <rect x="15" y="26" width="12" height="2" rx="1" fill="#e2e8f0"/>
  <rect x="15" y="31" width="15" height="2" rx="1" fill="#e2e8f0"/>

  <!-- Precision Crop Frame -->
  <rect x="13" y="14" width="22" height="23" rx="2" stroke="url(#crop-bg)" stroke-width="2" stroke-dasharray="3 2" fill="rgba(245, 158, 11, 0.08)"/>

  <!-- Crop Corner Marks (Interactive tool handles) -->
  <!-- Top Left -->
  <path d="M10 17 V14 A3 3 0 0 1 13 11 H16" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M32 11 H35 A3 3 0 0 1 38 14 V17" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M10 34 V37 A3 3 0 0 0 13 40 H16" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M32 40 H35 A3 3 0 0 0 38 37 V34" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Active Node -->
  <circle cx="24" cy="25.5" r="2.5" fill="#f59e0b"/>
</svg>

