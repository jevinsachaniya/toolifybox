<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="p2h-pdf-grad" x1="6" y1="6" x2="28" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="p2h-html-grad" x1="20" y1="12" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="p2h-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="p2h-shadow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left PDF Sheet -->
  <g filter="url(#p2h-shadow)">
    <rect x="7" y="9" width="19" height="26" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M20 9 L26 15 H22 A2 2 0 0 1 20 13 V9 Z" fill="#cbd5e1"/>
    <!-- PDF badge -->
    <rect x="9.5" y="17" width="14" height="6.5" rx="1.5" fill="url(#p2h-pdf-grad)"/>
    <text x="16.5" y="21.8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="3.8" font-weight="900" text-anchor="middle" letter-spacing="0.2">PDF</text>
    <!-- Document lines -->
    <rect x="10.5" y="26.5" width="12" height="1.8" rx="0.9" fill="#94a3b8"/>
    <rect x="10.5" y="30" width="8" height="1.8" rx="0.9" fill="#cbd5e1"/>
  </g>

  <!-- Right HTML Card -->
  <g filter="url(#p2h-shadow)">
    <rect x="21" y="13" width="20" height="26" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <!-- HTML browser header bar -->
    <path d="M21 16 A3 3 0 0 1 24 13 H38 A3 3 0 0 1 41 16 V19 H21 V16 Z" fill="#eff6ff"/>
    <circle cx="24" cy="16" r="1" fill="#ef4444"/>
    <circle cx="27" cy="16" r="1" fill="#f59e0b"/>
    <circle cx="30" cy="16" r="1" fill="#10b981"/>
    <!-- Code Brackets </ > -->
    <path d="M26.5 24 L24 26.5 L26.5 29" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35.5 24 L38 26.5 L35.5 29" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 23 L29.5 30" stroke="#f97316" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Semantic layout mini blocks -->
    <rect x="25" y="32.5" width="12" height="1.5" rx="0.75" fill="#93c5fd"/>
    <rect x="25" y="35" width="8" height="1.5" rx="0.75" fill="#bfdbfe"/>
  </g>

  <!-- Central Conversion Flow Arrow -->
  <circle cx="24" cy="26" r="6" fill="url(#p2h-accent)" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M22 26 H26 M24.5 24 L26.5 26 L24.5 28" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

