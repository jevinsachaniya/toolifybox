<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="p2x-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="p2x-pdf" x1="8" y1="8" x2="36" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="p2x-excel" x1="22" y1="14" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Back: PDF File -->
  <g filter="url(#p2x-shadow)" transform="rotate(-8 22 26)">
    <rect x="8" y="8" width="28" height="38" rx="5" fill="url(#p2x-pdf)" stroke="#fecdd3" stroke-width="0.8" />
    <!-- PDF Header Tag -->
    <rect x="8.5" y="8.5" width="27" height="11" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>
    <!-- Document lines -->
    <rect x="13" y="24" width="18" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.8" />
    <rect x="13" y="30" width="14" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.6" />
    <rect x="13" y="36" width="16" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- Front: Excel XLSX Spreadsheet -->
  <g filter="url(#p2x-shadow)">
    <rect x="22" y="14" width="32" height="42" rx="5" fill="url(#p2x-excel)" stroke="#a7f3d0" stroke-width="0.8" />
    
    <!-- Top Header Banner -->
    <rect x="22.5" y="14.5" width="31" height="12" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <text x="38" y="23.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">XLSX</text>

    <!-- Spreadsheet Data Grid -->
    <rect x="26" y="30" width="24" height="20" rx="2.5" fill="#ffffff" fill-opacity="0.18" />
    <!-- Grid rows -->
    <line x1="26" y1="35" x2="50" y2="35" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="26" y1="40" x2="50" y2="40" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="26" y1="45" x2="50" y2="45" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <!-- Grid columns -->
    <line x1="34" y1="30" x2="34" y2="50" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="42" y1="30" x2="42" y2="50" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.7" />

    <!-- Conversion Arrow Circle Badge -->
    <circle cx="20" cy="48" r="8" fill="#ffffff" filter="url(#p2x-shadow)" />
    <!-- Conversion Curved / Straight Arrow -->
    <path d="M16 48 L24 48 M21 45 L24 48 L21 51" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>