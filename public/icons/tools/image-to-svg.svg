<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="svg-card-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="svg-grad-bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="svg-badge-grad" x1="18" y1="42" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="svg-bezier-grad" x1="16" y1="16" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Card Backing -->
  <g filter="url(#svg-card-shadow)">
    <!-- Base Card -->
    <rect x="8" y="8" width="48" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Vector Canvas Viewport -->
    <rect x="12" y="12" width="40" height="30" rx="5" fill="#0f172a" />

    <!-- Vector Grid Accent Lines -->
    <path d="M12 22 L52 22 M12 32 L52 32 M25 12 L25 42 M39 12 L39 42" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Smooth Bézier Vector Curve -->
    <path d="M16 34 C 22 16, 32 16, 36 26 S 46 22, 48 18" stroke="url(#svg-bezier-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Anchor Control Points -->
    <rect x="14" y="32" width="4" height="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <rect x="34" y="24" width="4" height="4" fill="#a855f7" stroke="#ffffff" stroke-width="1" />
    <rect x="46" y="16" width="4" height="4" fill="#ec4899" stroke="#ffffff" stroke-width="1" />

    <!-- Bottom Pill: SVG Code Badge -->
    <rect x="16" y="44" width="32" height="12" rx="6" fill="url(#svg-badge-grad)" />

    <!-- SVG Tag & Sparkle Text Graphic in Pill -->
    <text x="32" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" letter-spacing="0.8">&lt;SVG/&gt;</text>
  </g>
</svg>

