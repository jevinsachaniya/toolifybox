<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="cimg-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="cimg-sky" x1="12" y1="12" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Photo Frame -->
  <g filter="url(#cimg-shadow)">
    <rect x="12" y="10" width="40" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Image Content -->
    <rect x="15" y="13" width="34" height="28" rx="3.5" fill="url(#cimg-sky)" />
    <!-- Golden Sun -->
    <circle cx="39" cy="20" r="3.5" fill="#fef08a" />
    <!-- Mountain -->
    <path d="M15 41 L27 28 L37 38 L42 32 L49 41 Z" fill="#4c1d95" opacity="0.9" />
    <!-- Gloss reflection -->
    <rect x="15" y="13" width="34" height="13" rx="3.5" fill="#ffffff" fill-opacity="0.25" />
    
    <!-- Inward compression arrows in badge -->
    <circle cx="32" cy="45" r="7.5" fill="#ea580c" />
    <path d="M28 45 L36 45 M30 43 L28 45 L30 47 M34 43 L36 45 L34 47" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

