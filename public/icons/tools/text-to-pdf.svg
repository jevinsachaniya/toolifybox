<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ttp-card-bg" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ttp-pdf-badge" x1="22" y1="28" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="ttp-type-badge" x1="8" y1="8" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="ttp-shadow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Base Document Sheet with Shadow -->
  <g filter="url(#ttp-shadow)">
    <rect x="8" y="6" width="32" height="36" rx="6" fill="url(#ttp-card-bg)"/>
    <rect x="8" y="6" width="32" height="36" rx="6" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Typography "T" Badge on Top Left -->
  <rect x="13" y="11" width="9" height="9" rx="2.5" fill="url(#ttp-type-badge)"/>
  <!-- "T" letterform -->
  <path d="M15.5 13.5 H19.5 M17.5 13.5 V17.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Text Heading Line -->
  <rect x="25" y="13" width="11" height="2" rx="1" fill="#475569"/>
  <rect x="25" y="17" width="7" height="1.8" rx="0.9" fill="#94a3b8"/>

  <!-- Text Body Paragraph Lines -->
  <rect x="13" y="23" width="22" height="2" rx="1" fill="#64748b"/>
  <rect x="13" y="27.5" width="20" height="2" rx="1" fill="#94a3b8"/>
  <rect x="13" y="32" width="14" height="2" rx="1" fill="#cbd5e1"/>

  <!-- Overlapping Red PDF Badge on Bottom Right -->
  <g filter="url(#ttp-shadow)">
    <rect x="23" y="29" width="19" height="13" rx="4" fill="url(#ttp-pdf-badge)"/>
    <rect x="23" y="29" width="19" height="13" rx="4" stroke="#ffffff" stroke-width="1.2"/>
  </g>
  <text x="32.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.4">PDF</text>
</svg>

