<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="bfr-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="bfr-back" x1="10" y1="8" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bfr-front" x1="22" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bfr-pencil" x1="38" y1="36" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Back Stacked Document -->
  <g filter="url(#bfr-shadow)" transform="rotate(-6 24 24)">
    <rect x="10" y="8" width="28" height="38" rx="5" fill="url(#bfr-back)" stroke="#bae6fd" stroke-width="0.8" />
    <rect x="15" y="16" width="18" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.75" />
    <rect x="15" y="22" width="14" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.5" />
    <rect x="15" y="28" width="16" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.5" />
  </g>

  <!-- Front Document with Name Tag -->
  <g filter="url(#bfr-shadow)">
    <rect x="22" y="14" width="30" height="40" rx="5" fill="url(#bfr-front)" stroke="#c7d2fe" stroke-width="0.8" />

    <!-- File Label Banner / Old Name -->
    <rect x="26" y="20" width="22" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2" />
    <text x="37" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">FILE_01</text>

    <!-- Arrow down to New Name -->
    <path d="M37 28.5 L37 32.5 M34.5 30.5 L37 32.5 L39.5 30.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Renamed Tag Badge / New Name -->
    <rect x="25" y="34" width="24" height="8" rx="4" fill="#10b981" />
    <text x="37" y="39.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.2" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.4">NEW_01</text>

    <!-- Rename Edit Pencil Badge -->
    <circle cx="48" cy="48" r="8.5" fill="#ffffff" filter="url(#bfr-shadow)" />
    <!-- Pencil icon -->
    <path d="M44 51 L46.5 50.5 L51.5 45.5 L49.5 43.5 L44.5 48.5 L44 51 Z" fill="url(#bfr-pencil)" />
    <path d="M50.5 42.5 L52.5 44.5" stroke="#ffffff" stroke-width="0.8" />
  </g>
</svg>