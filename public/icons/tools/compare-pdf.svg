<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="comp-bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="comp-sheet-a" x1="6" y1="8" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="comp-sheet-b" x1="20" y1="8" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="comp-shadow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Document (Original / Red indicator) -->
  <g filter="url(#comp-shadow)">
    <rect x="7" y="8" width="20" height="28" rx="3" fill="url(#comp-sheet-a)"/>
    <path d="M21 8 L27 14 H23 A2 2 0 0 1 21 12 V8 Z" fill="#94a3b8"/>
    <!-- Red deleted diff line -->
    <rect x="11" y="16" width="12" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="11" y="21" width="12" height="2" rx="1" fill="#f87171"/>
    <rect x="11" y="26" width="8" height="2" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Right Document (Revised / Green indicator) -->
  <g filter="url(#comp-shadow)">
    <rect x="21" y="12" width="20" height="28" rx="3" fill="url(#comp-sheet-b)" stroke="#6366f1" stroke-width="1.2"/>
    <path d="M35 12 L41 18 H37 A2 2 0 0 1 35 16 V12 Z" fill="#818cf8"/>
    <!-- Green added diff line -->
    <rect x="25" y="20" width="12" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="25" y="25" width="12" height="2" rx="1" fill="#34d399"/>
    <rect x="25" y="30" width="8" height="2" rx="1" fill="#34d399"/>
  </g>

  <!-- Central Compare Badge -->
  <circle cx="24" cy="24" r="7" fill="url(#comp-bg)" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M21.5 22.5 L24 20 L26.5 22.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26.5 25.5 L24 28 L21.5 25.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

