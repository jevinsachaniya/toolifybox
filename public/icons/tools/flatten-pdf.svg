<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="flt-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="flt-base" x1="14" y1="28" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Top Floating Layer 1 -->
  <g filter="url(#flt-shadow)" opacity="0.6">
    <path d="M32 10 L52 20 L32 30 L12 20 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Middle Floating Layer 2 -->
  <g filter="url(#flt-shadow)" opacity="0.8">
    <path d="M32 18 L52 28 L32 38 L12 28 Z" fill="#64748b" stroke="#94a3b8" stroke-width="0.8" />
  </g>

  <!-- Bottom Solid Flattened Sheet -->
  <g filter="url(#flt-shadow)">
    <path d="M32 26 L52 36 L32 46 L12 36 Z" fill="url(#flt-base)" stroke="#94a3b8" stroke-width="1" />
    <path d="M12 36 L12 42 L32 52 L52 42 L52 36 L32 46 Z" fill="#0f172a" opacity="0.7" />
    <!-- Checkmark on flattened sheet -->
    <path d="M26 36 L30 40 L38 32" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

