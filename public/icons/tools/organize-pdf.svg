<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="orgpdf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="orgpdf-page1" x1="8" y1="12" x2="34" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="orgpdf-page2" x1="18" y1="8" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="orgpdf-page3" x1="26" y1="16" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Left Arranged Page -->
  <g filter="url(#orgpdf-shadow)" transform="rotate(-10 20 30)">
    <rect x="8" y="14" width="24" height="34" rx="4" fill="url(#orgpdf-page1)" stroke="#ffe4e6" stroke-width="0.8" />
    <rect x="12" y="20" width="16" height="2.5" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="12" y="25" width="12" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="12" y="29" width="14" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <circle cx="20" cy="39" r="4.5" fill="#ffffff" opacity="0.9" />
    <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#e11d48" text-anchor="middle">1</text>
  </g>

  <!-- Right Arranged Page -->
  <g filter="url(#orgpdf-shadow)" transform="rotate(8 42 32)">
    <rect x="30" y="12" width="24" height="34" rx="4" fill="url(#orgpdf-page2)" stroke="#ffe4e6" stroke-width="0.8" />
    <rect x="34" y="18" width="16" height="2.5" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="34" y="23" width="13" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="34" y="27" width="11" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <circle cx="42" cy="37" r="4.5" fill="#ffffff" opacity="0.9" />
    <text x="42" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#f43f5e" text-anchor="middle">3</text>
  </g>

  <!-- Center Active Page (Organized) -->
  <g filter="url(#orgpdf-shadow)">
    <rect x="19" y="10" width="26" height="36" rx="4.5" fill="url(#orgpdf-page3)" stroke="#fff1f2" stroke-width="1" />
    <!-- Header bar -->
    <rect x="19.5" y="10.5" width="25" height="9" rx="3.5" fill="#ffffff" fill-opacity="0.22" />
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">ORGANIZE</text>
    
    <!-- Body lines -->
    <rect x="23" y="23" width="18" height="2.5" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="23" y="28" width="14" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="23" y="32" width="16" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <circle cx="32" cy="39" r="4.5" fill="#ffffff" />
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#be123c" text-anchor="middle">2</text>
    
    <!-- Swap/Reorder Badge -->
    <circle cx="47" cy="46" r="8.5" fill="#ffffff" filter="url(#orgpdf-shadow)" />
    <!-- Reorder Arrows -->
    <path d="M42.5 44 L51.5 44 M48.5 41.5 L51.5 44 L48.5 46.5" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M51.5 48 L42.5 48 M45.5 50.5 L42.5 48 L45.5 45.5" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

