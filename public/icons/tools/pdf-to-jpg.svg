<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="p2j-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="p2j-pdf" x1="4" y1="12" x2="28" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="p2j-photo-sky" x1="32" y1="20" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="45%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="p2j-photo-mtn" x1="32" y1="36" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Left PDF Sheet -->
  <g filter="url(#p2j-shadow)">
    <rect x="5" y="14" width="24" height="30" rx="4" fill="url(#p2j-pdf)" stroke="#fda4af" stroke-width="0.75" />
    <text x="17" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
    <rect x="9" y="32" width="16" height="2" rx="1" fill="#ffffff" opacity="0.7" />
    <rect x="9" y="36" width="11" height="2" rx="1" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Right Vibrant 3D Photo Tile -->
  <g filter="url(#p2j-shadow)">
    <!-- Photo Frame (White border like Polaroid / glossy photo) -->
    <rect x="30" y="18" width="30" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Image Area with Sky & Mountains -->
    <rect x="33" y="21" width="24" height="22" rx="3" fill="url(#p2j-photo-sky)" />
    <!-- Golden Sun -->
    <circle cx="50" cy="27" r="3.5" fill="#fef08a" />
    <!-- Mountain Peak 1 -->
    <path d="M33 43 L42 32 L49 43 Z" fill="url(#p2j-photo-mtn)" />
    <!-- Mountain Peak 2 -->
    <path d="M44 43 L51 35 L57 43 Z" fill="#4338ca" opacity="0.8" />
    <!-- Gloss highlight on photo -->
    <rect x="33" y="21" width="24" height="10" rx="3" fill="#ffffff" fill-opacity="0.25" />
    <!-- JPG Badge at bottom -->
    <rect x="38" y="45.5" width="14" height="4.5" rx="1.5" fill="#ea580c" />
    <text x="45" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.4">JPG</text>
  </g>

  <!-- Connecting Arrow -->
  <path d="M23 29 L31 29 M28 26 L31 29 L28 32" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>

