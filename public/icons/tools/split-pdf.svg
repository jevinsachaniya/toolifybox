<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="spdf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="spdf-left" x1="8" y1="12" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="spdf-right" x1="36" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Left Separated Half -->
  <g filter="url(#spdf-shadow)">
    <path d="M10 12 L28 12 L28 52 L10 52 C8.9 52 8 51.1 8 50 L8 14 C8 12.9 8.9 12 10 12 Z" fill="url(#spdf-left)" stroke="#bae6fd" stroke-width="0.8" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">PART 1</text>
    <rect x="12" y="32" width="13" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="12" y="37" width="10" height="2" rx="1" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Right Separated Half -->
  <g filter="url(#spdf-shadow)">
    <path d="M36 12 L54 12 C55.1 12 56 12.9 56 14 L56 50 C56 51.1 55.1 52 54 52 L36 52 Z" fill="url(#spdf-right)" stroke="#bae6fd" stroke-width="0.8" />
    <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle">PART 2</text>
    <rect x="39" y="32" width="13" height="2" rx="1" fill="#ffffff" opacity="0.75" />
    <rect x="39" y="37" width="9" height="2" rx="1" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Central Cutting Line & Scissors -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3" />
  <g filter="url(#spdf-shadow)">
    <circle cx="32" cy="32" r="7.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Scissor icon inside circle -->
    <path d="M29 30 L35 34 M29 34 L35 30" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>

