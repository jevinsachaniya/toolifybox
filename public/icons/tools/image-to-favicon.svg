<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="fav-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="fav-bg-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="fav-browser-bar" x1="8" y1="8" x2="56" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="fav-ico-grad" x1="16" y1="22" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="fav-star-grad" x1="24" y1="26" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Browser Window Card -->
  <g filter="url(#fav-shadow)">
    <!-- Browser Body -->
    <rect x="8" y="10" width="48" height="44" rx="8" fill="url(#fav-bg-grad)" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <path d="M8 18 C8 13.578 11.578 10 16 10 L48 10 C52.422 10 56 13.578 56 18 L56 22 L8 22 Z" fill="url(#fav-browser-bar)" />
    
    <!-- Browser Traffic Light Dots -->
    <circle cx="14" cy="16" r="2" fill="#ef4444" />
    <circle cx="20" cy="16" r="2" fill="#f59e0b" />
    <circle cx="26" cy="16" r="2" fill="#10b981" />

    <!-- Active Tab Shape with Mini Favicon -->
    <path d="M32 22 L34 14 C34.5 12.5 35.8 12 37.5 12 L49 12 C50.7 12 52 12.5 52.5 14 L54.5 22 Z" fill="#ffffff" />
    <circle cx="39" cy="17" r="2.2" fill="#f59e0b" />
    <rect x="43" y="15.5" width="6" height="3" rx="1.5" fill="#94a3b8" />

    <!-- Central Favicon Badge (Squircle) -->
    <rect x="18" y="26" width="28" height="24" rx="6" fill="url(#fav-ico-grad)" />
    
    <!-- Star Icon in Favicon -->
    <path d="M32 30.5 L34 35.5 L39.5 36 L35.5 39.8 L36.7 45.2 L32 42.2 L27.3 45.2 L28.5 39.8 L24.5 36 L30 35.5 Z" fill="url(#fav-star-grad)" />

    <!-- Tiny .ICO pill badge -->
    <rect x="36" y="44" width="18" height="8" rx="4" fill="#0f172a" />
    <text x="45" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="5" font-weight="800" fill="#38bdf8" text-anchor="middle">.ICO</text>
  </g>
</svg>
