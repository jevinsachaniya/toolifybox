<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bcs-card-grad" x1="6" y1="8" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bcs-emerald" x1="26" y1="22" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bcs-blue" x1="4" y1="8" x2="20" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bcs-scan" x1="6" y1="18" x2="38" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="bcs-shadow" x="2" y="5" width="44" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="bcs-badge-shadow" x="23" y="21" width="22" height="22" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Back Card (Back side card offset) -->
  <rect x="10" y="6" width="32" height="24" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="14" y1="11" x2="24" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="15" x2="28" y2="15" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main Front Business Card with Shadow -->
  <g filter="url(#bcs-shadow)">
    <rect x="5" y="10" width="35" height="26" rx="4.5" fill="url(#bcs-card-grad)" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>

  <!-- Card Avatar / Logo placeholder -->
  <circle cx="12" cy="18" r="4" fill="url(#bcs-blue)"/>
  <!-- User silhouette in avatar -->
  <circle cx="12" cy="16.5" r="1.6" fill="#ffffff"/>
  <path d="M9.5 21c0-1.4 1.1-2.2 2.5-2.2s2.5.8 2.5 2.2" stroke="#ffffff" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Card text lines (Name, Title, Company) -->
  <line x1="19" y1="16" x2="35" y2="16" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="20" x2="31" y2="20" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Contact details micro lines -->
  <circle cx="11" cy="27" r="1" fill="#3b82f6"/>
  <line x1="14" y1="27" x2="23" y2="27" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <circle cx="11" cy="31" r="1" fill="#10b981"/>
  <line x1="14" y1="31" x2="21" y2="31" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

  <!-- Glowing Laser Scan Line -->
  <line x1="6" y1="23" x2="38" y2="23" stroke="url(#bcs-scan)" stroke-width="1.5"/>

  <!-- Excel / Spreadsheet Export Badge -->
  <g filter="url(#bcs-badge-shadow)">
    <rect x="25" y="24" width="18" height="18" rx="4" fill="url(#bcs-emerald)"/>
    <!-- Spreadsheet Grid in Badge -->
    <rect x="27.5" y="26.5" width="13" height="13" rx="1.5" fill="#ffffff" fill-opacity="0.15"/>
    <line x1="27.5" y1="31" x2="40.5" y2="31" stroke="#ffffff" stroke-width="1"/>
    <line x1="27.5" y1="35.5" x2="40.5" y2="35.5" stroke="#ffffff" stroke-width="1"/>
    <line x1="33" y1="26.5" x2="33" y2="39.5" stroke="#ffffff" stroke-width="1"/>
    <!-- Bold 'X' for Excel inside badge -->
    <path d="M29.5 28.5l2.2 3.2m0-3.2l-2.2 3.2" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
