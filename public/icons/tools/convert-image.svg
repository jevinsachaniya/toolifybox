<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="conv-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="conv-bg-grad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="conv-sun-grad" x1="20" y1="18" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="conv-badge-grad" x1="22" y1="36" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Photo Card Backing -->
  <g filter="url(#conv-shadow)">
    <!-- Base Card -->
    <rect x="8" y="10" width="48" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Image Viewport -->
    <rect x="12" y="14" width="40" height="26" rx="4" fill="url(#conv-bg-grad)" />

    <!-- Sun Circle -->
    <circle cx="22" cy="22" r="4" fill="url(#conv-sun-grad)" />

    <!-- Mountains Vector -->
    <path d="M12 40 L24 27 L32 35 L40 26 L52 40 Z" fill="#1e1b4b" opacity="0.85" />

    <!-- Light reflection shine -->
    <path d="M12 14 L52 14 L42 26 L12 26 Z" fill="#ffffff" fill-opacity="0.15" />

    <!-- Bottom Conversion Pill -->
    <rect x="16" y="43" width="32" height="13" rx="6.5" fill="url(#conv-badge-grad)" />

    <!-- Swap / Transform Arrows in Pill -->
    <path d="M23 48 L29 48 M27 46 L29 48 L27 50" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M41 51 L35 51 M37 49 L35 51 L37 53" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

