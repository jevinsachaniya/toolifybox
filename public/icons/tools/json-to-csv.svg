<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="j2c-json-grad" x1="6" y1="10" x2="26" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="j2c-csv-grad" x1="20" y1="12" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="j2c-arrow-grad" x1="16" y1="20" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="j2c-shadow" x="2" y="2" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Left Sheet: JSON Document -->
  <g filter="url(#j2c-shadow)">
    <rect x="6" y="8" width="19" height="27" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M19 8 L25 14 H21 A2 2 0 0 1 19 12 V8 Z" fill="#cbd5e1"/>
    <!-- JSON badge -->
    <rect x="8.5" y="16" width="14" height="6.5" rx="1.5" fill="url(#j2c-json-grad)"/>
    <text x="15.5" y="20.8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="3.4" font-weight="900" text-anchor="middle" letter-spacing="0.2">{JSON}</text>
    <!-- Code lines -->
    <rect x="9.5" y="25" width="12" height="1.8" rx="0.9" fill="#f59e0b" fill-opacity="0.7"/>
    <rect x="9.5" y="28.5" width="8" height="1.8" rx="0.9" fill="#cbd5e1"/>
  </g>

  <!-- Right Sheet: CSV Spreadsheet Document -->
  <g filter="url(#j2c-shadow)">
    <rect x="23" y="13" width="19" height="27" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
    <path d="M36 13 L42 19 H38 A2 2 0 0 1 36 17 V13 Z" fill="#6ee7b7"/>
    <!-- Emerald CSV badge -->
    <rect x="25.5" y="21" width="14" height="6.5" rx="1.5" fill="url(#j2c-csv-grad)"/>
    <text x="32.5" y="25.8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="3.6" font-weight="900" text-anchor="middle" letter-spacing="0.2">CSV</text>
    <!-- Table Grid lines -->
    <rect x="26" y="29.5" width="13" height="1.6" rx="0.8" fill="#10b981"/>
    <rect x="26" y="32.5" width="6" height="1.6" rx="0.8" fill="#a7f3d0"/>
    <rect x="33" y="32.5" width="6" height="1.6" rx="0.8" fill="#a7f3d0"/>
  </g>

  <!-- Circular Transfer Action Badge in center -->
  <g filter="url(#j2c-shadow)">
    <circle cx="24" cy="24" r="7.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="24" r="6" fill="url(#j2c-arrow-grad)"/>
    <!-- Right arrow icon -->
    <path d="M22 21 L26 24 L22 27" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

