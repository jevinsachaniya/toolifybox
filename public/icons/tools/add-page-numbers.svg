<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="page-num-bg" x1="6" y1="4" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="page-num-sheet" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="page-num-shadow" x="8" y="6" width="32" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Document Sheet -->
  <g filter="url(#page-num-shadow)">
    <rect x="11" y="7" width="26" height="34" rx="4" fill="url(#page-num-sheet)"/>
    <path d="M29 7 L37 15 L29 15 Z" fill="#cbd5e1"/>
    <path d="M29 7 L37 15 H31 A2 2 0 0 1 29 13 V7 Z" fill="#94a3b8"/>
  </g>

  <!-- Document content lines -->
  <rect x="15" y="18" width="18" height="2" rx="1" fill="#cbd5e1"/>
  <rect x="15" y="23" width="18" height="2" rx="1" fill="#cbd5e1"/>
  <rect x="15" y="28" width="12" height="2" rx="1" fill="#cbd5e1"/>

  <!-- Page Number Badge at bottom -->
  <rect x="19" y="33" width="10" height="5" rx="2.5" fill="url(#page-num-bg)"/>
  <text x="24" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="3.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1/3</text>
</svg>

