<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="cpdf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="cpdf-bg" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- PDF Document Being Compressed -->
  <g filter="url(#cpdf-shadow)">
    <rect x="16" y="10" width="32" height="44" rx="6" fill="url(#cpdf-bg)" stroke="#99f6e4" stroke-width="0.8" />
    <rect x="16.5" y="10.5" width="31" height="15" rx="5.5" fill="#ffffff" fill-opacity="0.25" />
    <text x="32" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>
    
    <!-- Central Compacting Vise / Inward Arrows -->
    <g fill="#ffffff">
      <!-- Top Arrow pointing down -->
      <path d="M32 40 L27 34 L30 34 L30 30 L34 30 L34 34 L37 34 Z" opacity="0.95" />
      <!-- Bottom Arrow pointing up -->
      <path d="M32 42 L27 48 L30 48 L30 52 L34 52 L34 48 L37 48 Z" opacity="0.95" />
    </g>

    <!-- Size reduction badge -->
    <rect x="22" y="49" width="20" height="2" rx="1" fill="#ffffff" opacity="0.75" />
  </g>
</svg>

