<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="p2w-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="p2w-pdf" x1="4" y1="12" x2="28" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="p2w-word" x1="36" y1="20" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#185abd" />
      <stop offset="100%" stop-color="#103f91" />
    </linearGradient>
    <linearGradient id="p2w-arrow" x1="26" y1="28" x2="38" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Left PDF Tile -->
  <g filter="url(#p2w-shadow)">
    <rect x="4" y="12" width="26" height="32" rx="5" fill="url(#p2w-pdf)" stroke="#fda4af" stroke-width="0.75" />
    <rect x="4.5" y="12.5" width="25" height="12" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <!-- PDF Text -->
    <text x="17" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>
    <rect x="9" y="33" width="16" height="2" rx="1" fill="#ffffff" opacity="0.7" />
    <rect x="9" y="37" width="11" height="2" rx="1" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Right Word Tile -->
  <g filter="url(#p2w-shadow)">
    <rect x="34" y="20" width="26" height="32" rx="5" fill="url(#p2w-word)" stroke="#93c5fd" stroke-width="0.75" />
    <rect x="34.5" y="20.5" width="25" height="12" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <!-- Word W -->
    <path d="M40 28 L42.2 39 L44.4 32 L46.6 32 L48.8 39 L51 28 L53 28 L49.8 42 L47.6 42 L45.5 34.5 L43.4 42 L41.2 42 L38 28 Z" fill="#ffffff" />
    <rect x="39" y="45" width="16" height="2" rx="1" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Flow / Convert Arrow -->
  <path d="M26 28 L34 28 M31 25 L34 28 L31 31" stroke="url(#p2w-arrow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

