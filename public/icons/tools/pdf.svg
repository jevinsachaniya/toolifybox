<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="pdf-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="pdf-tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#4c0519" flood-opacity="0.45" />
    </filter>
    <linearGradient id="pdf-page" x1="16" y1="4" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
    <linearGradient id="pdf-fold" x1="40" y1="4" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="pdf-tile" x1="6" y1="20" x2="38" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="pdf-tile-gloss" x1="6" y1="20" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Back Sheet (PDF Document) -->
  <g filter="url(#pdf-shadow)">
    <!-- Main page body with dog-ear cutout -->
    <path d="M18 6 C16.9 6 16 6.9 16 8 L16 54 C16 55.1 16.9 56 18 56 L50 56 C51.1 56 52 55.1 52 54 L52 18 L40 6 L18 6 Z" fill="url(#pdf-page)" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Folded dog-ear corner -->
    <path d="M40 6 L40 16 C40 17.1 40.9 18 42 18 L52 18 Z" fill="url(#pdf-fold)" stroke="#fb7185" stroke-width="0.5" />
  </g>

  <!-- Stylized PDF Document Lines -->
  <rect x="24" y="24" width="22" height="2.5" rx="1.25" fill="#fda4af" opacity="0.6" />
  <rect x="36" y="30" width="10" height="2.5" rx="1.25" fill="#cbd5e1" opacity="0.8" />
  <rect x="36" y="36" width="10" height="2.5" rx="1.25" fill="#cbd5e1" opacity="0.8" />
  <rect x="24" y="42" width="22" height="2.5" rx="1.25" fill="#cbd5e1" opacity="0.8" />
  <rect x="24" y="48" width="16" height="2.5" rx="1.25" fill="#cbd5e1" opacity="0.8" />

  <!-- Front 3D Tile (PDF Badge) -->
  <g filter="url(#pdf-tile-shadow)">
    <rect x="8" y="22" width="30" height="30" rx="6" fill="url(#pdf-tile)" />
    <!-- Top-edge specular highlight -->
    <rect x="8.5" y="22.5" width="29" height="14" rx="5.5" fill="url(#pdf-tile-gloss)" />
    <rect x="8" y="22" width="30" height="30" rx="6" stroke="#fb7185" stroke-width="0.75" stroke-opacity="0.5" />
    
    <!-- Bold Embossed "PDF" Letters -->
    <g fill="#ffffff">
      <!-- P -->
      <path d="M12.5 31 L15.8 31 C17.2 31 18.2 31.9 18.2 33.3 C18.2 34.7 17.2 35.6 15.8 35.6 L14 35.6 L14 39 L12.5 39 Z M14 34.3 L15.7 34.3 C16.4 34.3 16.8 33.9 16.8 33.3 C16.8 32.7 16.4 32.3 15.7 32.3 L14 32.3 Z" />
      <!-- D -->
      <path d="M19.5 31 L22.8 31 C24.7 31 26 32.6 26 35 C26 37.4 24.7 39 22.8 39 L19.5 39 Z M21 37.7 L22.7 37.7 C23.8 37.7 24.5 36.7 24.5 35 C24.5 33.3 23.8 32.3 22.7 32.3 L21 32.3 Z" />
      <!-- F -->
      <path d="M27.5 31 L32 31 L32 32.3 L29 32.3 L29 34.4 L31.5 34.4 L31.5 35.7 L29 35.7 L29 39 L27.5 39 Z" />
    </g>
    <!-- Accent Ribbon Arc Under PDF -->
    <path d="M13 42.5 Q23 45 33 42.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>

