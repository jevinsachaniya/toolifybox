<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bf-card-bg" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bf-avatar" x1="16" y1="12" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bf-blur-accent" x1="12" y1="16" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bf-sparkle" x1="28" y1="6" x2="44" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="bf-shadow" x="4" y="4" width="40" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bf-card-clip">
      <rect x="7" y="7" width="34" height="34" rx="8"/>
    </clipPath>
  </defs>

  <!-- Base Card with Shadow -->
  <g filter="url(#bf-shadow)">
    <rect x="7" y="7" width="34" height="34" rx="8" fill="url(#bf-card-bg)"/>
    <rect x="7" y="7" width="34" height="34" rx="8" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Face Portrait Cutout -->
  <g clip-path="url(#bf-card-clip)">
    <!-- Face / Head Silhouette -->
    <circle cx="24" cy="18" r="6.5" fill="url(#bf-avatar)"/>
    <!-- Shoulders -->
    <path d="M12 37 C12 28.5, 16.5 25.5, 24 25.5 C31.5 25.5, 36 28.5, 36 37 Z" fill="url(#bf-avatar)"/>

    <!-- Privacy Blur / Mosaic Visor Bar across face -->
    <rect x="13" y="15" width="22" height="9" rx="3" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="13" y="15" width="22" height="9" rx="3" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Mosaic Pixel Blocks inside the Visor -->
    <rect x="14.5" y="16.5" width="2.5" height="2.5" rx="0.5" fill="#0284c7" fill-opacity="0.75"/>
    <rect x="18" y="16.5" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="21.5" y="16.5" width="2.5" height="2.5" rx="0.5" fill="#0284c7" fill-opacity="0.6"/>
    <rect x="25" y="16.5" width="2.5" height="2.5" rx="0.5" fill="#2563eb" fill-opacity="0.8"/>
    <rect x="28.5" y="16.5" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="32" y="16.5" width="1.5" height="2.5" rx="0.5" fill="#0284c7" fill-opacity="0.85"/>

    <rect x="14.5" y="20" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" fill-opacity="0.85"/>
    <rect x="18" y="20" width="2.5" height="2.5" rx="0.5" fill="#2563eb" fill-opacity="0.75"/>
    <rect x="21.5" y="20" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" fill-opacity="0.95"/>
    <rect x="25" y="20" width="2.5" height="2.5" rx="0.5" fill="#0284c7" fill-opacity="0.7"/>
    <rect x="28.5" y="20" width="2.5" height="2.5" rx="0.5" fill="#2563eb" fill-opacity="0.85"/>
    <rect x="32" y="20" width="1.5" height="2.5" rx="0.5" fill="#38bdf8" fill-opacity="0.8"/>

    <!-- Target Focus Corner Reticles -->
    <path d="M10 12 L10 10 L12 10" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M38 12 L38 10 L36 10" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 26 L10 28 L12 28" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M38 26 L38 28 L36 28" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Shield Privacy Badge in Top-Right -->
  <g filter="url(#bf-shadow)">
    <circle cx="36" cy="12" r="7" fill="#ffffff"/>
    <circle cx="36" cy="12" r="6" fill="url(#bf-sparkle)"/>
    <!-- Shield check icon -->
    <path d="M36 8.5 L39.5 9.8 C39.5 12.8 38 14.8 36 15.8 C34 14.8 32.5 12.8 32.5 9.8 L36 8.5 Z" fill="#ffffff"/>
  </g>
</svg>

