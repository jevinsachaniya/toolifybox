<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="i2p-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <linearGradient id="i2p-photo-emerald" x1="6" y1="12" x2="28" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="i2p-pdf" x1="32" y1="18" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
  </defs>

  <!-- Left Photo Stacks -->
  <g filter="url(#i2p-shadow)" transform="rotate(-8 16 28)">
    <rect x="6" y="14" width="24" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <rect x="8" y="16" width="20" height="18" rx="2.5" fill="url(#i2p-photo-emerald)" />
    <circle cx="23" cy="22" r="2.5" fill="#fef08a" />
    <path d="M8 34 L15 25 L24 34 Z" fill="#065f46" />
  </g>

  <!-- Right PDF Document Destination -->
  <g filter="url(#i2p-shadow)">
    <rect x="30" y="16" width="28" height="36" rx="5" fill="url(#i2p-pdf)" stroke="#fda4af" stroke-width="0.8" />
    <rect x="30.5" y="16.5" width="27" height="14" rx="4.5" fill="#ffffff" fill-opacity="0.25" />
    <text x="44" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
    <!-- Document Stack Lines -->
    <rect x="36" y="38" width="16" height="2.2" rx="1.1" fill="#ffffff" opacity="0.8" />
    <rect x="36" y="42" width="12" height="2.2" rx="1.1" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Converge Arrow -->
  <path d="M24 30 L32 30 M29 27 L32 30 L29 33" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

