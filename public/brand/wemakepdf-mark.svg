<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="We Make PDF icon">
  <defs>
    <!-- Soft 3D drop shadow -->
    <filter id="wmp-shadow" x="-20%" y="-15%" width="145%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#881337" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <!-- Fold shadow over white sheet -->
    <filter id="wmp-fold-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Inner document shadow -->
    <filter id="wmp-sheet-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Gradients -->
    <!-- Primary Outer Red Ribbon Loop -->
    <linearGradient id="wmp-red-main" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF2453" />
      <stop offset="30%" stop-color="#F43F5E" />
      <stop offset="65%" stop-color="#E11D48" />
      <stop offset="90%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Left spine gloss -->
    <linearGradient id="wmp-red-spine" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FF3868" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Bottom wrapping ribbon curve -->
    <linearGradient id="wmp-red-bottom" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="25%" stop-color="#BE123C" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="90%" stop-color="#FF2453" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Top-Right 3D Origami Flap -->
    <linearGradient id="wmp-red-fold" x1="0.85" y1="0.05" x2="0.15" y2="0.95">
      <stop offset="0%" stop-color="#FF6382" />
      <stop offset="40%" stop-color="#FF2E55" />
      <stop offset="85%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- White Paper Document Gradient -->
    <linearGradient id="wmp-paper" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Inner fold crevice shadow -->
    <linearGradient id="wmp-crevice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C0519" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="120" cy="204" rx="60" ry="10" fill="#0f172a" opacity="0.15" />

  <!-- RED RIBBON BACK/BASE CASING -->
  <g filter="url(#wmp-shadow)">
    <!-- Base 3D folded casing (loop around paper) -->
    <path
      d="M84 28 C68 28, 52 42, 52 60 L52 142 C52 162, 70 176, 92 176 L144 176 C166 176, 180 162, 180 142 L180 80 C180 60, 166 28, 134 28 Z"
      fill="url(#wmp-red-main)"
    />
  </g>

  <!-- WHITE DOCUMENT SHEET -->
  <g filter="url(#wmp-sheet-shadow)">
    <!-- White paper body -->
    <rect x="74" y="46" width="88" height="114" rx="12" fill="url(#wmp-paper)" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Centered bold 'PDF' typographic logo on the document -->
    <text
      x="118"
      y="114"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif"
      font-size="30"
      font-weight="900"
      letter-spacing="-0.8"
      fill="#0B132B"
    >PDF</text>
  </g>

  <!-- FRONT RED RIBBON WRAP & DIMENSIONAL 3D CURVES -->
  <!-- Left Spine 3D Bevel/Highlight -->
  <path
    d="M84 28 C68 28, 52 42, 52 60 L52 142 C52 156, 62 168, 76 173 C71 165, 68 154, 68 142 L68 60 C68 47, 74 37, 84 28 Z"
    fill="url(#wmp-red-spine)"
  />

  <!-- Bottom Front Ribbon Loop with depth wrap -->
  <path
    d="M66 148 C74 166, 92 176, 114 176 L146 176 C166 176, 180 162, 180 142 C180 134, 175 131, 167 138 C155 153, 137 163, 115 163 C97 163, 80 155, 66 148 Z"
    fill="url(#wmp-red-bottom)"
  />

  <!-- Top-Right 3D Origami Fold / Dog-Ear Curl Over the Document -->
  <g filter="url(#wmp-fold-shadow)">
    <!-- Diagonal Fold Flap -->
    <path
      d="M134 28 C152 28, 180 48, 180 80 C180 87, 173 93, 165 86 C152 71, 144 56, 133 42 C128 36, 128 29, 134 28 Z"
      fill="url(#wmp-red-fold)"
    />
  </g>

  <!-- Crevice Shadow directly under the top-right fold -->
  <path
    d="M134 42 C144 56, 152 71, 165 86 C167 88, 164 90, 161 88 C148 74, 140 60, 132 46 Z"
    fill="url(#wmp-crevice)"
  />

  <!-- High-gloss specular highlight line along top edge -->
  <path
    d="M86 31 C100 30, 120 30, 136 33"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.45"
  />
</svg>
