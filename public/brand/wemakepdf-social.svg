<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">We Make PDF — Free Private PDF &amp; Document Tools</title>
  <desc id="desc">Convert, edit, and optimize PDF documents privately in your browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff5f6" />
      <stop offset=".4" stop-color="#fdf2f4" />
      <stop offset="1" stop-color="#f8fafc" />
    </linearGradient>

    <filter id="soc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#881337" flood-opacity=".25" />
    </filter>

    <linearGradient id="soc-red-main" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF2453" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="65%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="soc-red-spine" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FF3868" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <linearGradient id="soc-red-bottom" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="30%" stop-color="#BE123C" />
      <stop offset="70%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FF2453" />
    </linearGradient>

    <linearGradient id="soc-red-fold" x1="0.85" y1="0.05" x2="0.15" y2="0.95">
      <stop offset="0%" stop-color="#FF6382" />
      <stop offset="40%" stop-color="#FF2E55" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <linearGradient id="soc-paper" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1090" cy="90" r="300" fill="#ffe4e6" opacity=".5" />
  <circle cx="120" cy="580" r="260" fill="#fecdd3" opacity=".4" />

  <!-- HD 3D Emblem -->
  <g transform="translate(110 150) scale(1.6)" filter="url(#soc-shadow)">
    <ellipse cx="120" cy="204" rx="60" ry="10" fill="#0f172a" opacity="0.16" />
    <path
      d="M84 28 C68 28, 52 42, 52 60 L52 142 C52 162, 70 176, 92 176 L144 176 C166 176, 180 162, 180 142 L180 80 C180 60, 166 28, 134 28 Z"
      fill="url(#soc-red-main)"
    />
    <rect x="74" y="46" width="88" height="114" rx="12" fill="url(#soc-paper)" stroke="#E2E8F0" stroke-width="1.5" />
    <text
      x="118"
      y="114"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif"
      font-size="30"
      font-weight="900"
      letter-spacing="-0.8"
      fill="#0B132B"
    >PDF</text>
    <path
      d="M84 28 C68 28, 52 42, 52 60 L52 142 C52 156, 62 168, 76 173 C71 165, 68 154, 68 142 L68 60 C68 47, 74 37, 84 28 Z"
      fill="url(#soc-red-spine)"
    />
    <path
      d="M66 148 C74 166, 92 176, 114 176 L146 176 C166 176, 180 162, 180 142 C180 134, 175 131, 167 138 C155 153, 137 163, 115 163 C97 163, 80 155, 66 148 Z"
      fill="url(#soc-red-bottom)"
    />
    <path
      d="M134 28 C152 28, 180 48, 180 80 C180 87, 173 93, 165 86 C152 71, 144 56, 133 42 C128 36, 128 29, 134 28 Z"
      fill="url(#soc-red-fold)"
    />
    <path
      d="M86 31 C100 30, 120 30, 136 33"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>

  <!-- Divider -->
  <path d="M470 170v290" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

  <!-- Typography -->
  <text x="520" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="92" font-weight="800" letter-spacing="-3">
    <tspan fill="#0F172A">We Make </tspan><tspan fill="#E11D48">PDF</tspan>
  </text>
  <text x="525" y="355" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="4">
    FREE &amp; 100% PRIVATE DOCUMENT TOOLS
  </text>
  <text x="525" y="415" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="24">
    Convert, edit, and organize files entirely on your device.
  </text>
</svg>

